<!DOCTYPE html>
<html>
<head>
    <title>Text Editor</title>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 15px;
            background: #eee;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <h1>Text Editor</h1>

    <p>Enter your text and choose an action.</p>

    <form method="POST">

        <textarea name="text" placeholder="Enter your text..."></textarea>

        <br>

        <button name="action" value="uppercase">
            UPPERCASE
        </button>

        <button name="action" value="lowercase">
            lowercase
        </button>

        <button name="action" value="capitalize">
            Capitalize
        </button>

        <button name="action" value="remove_spaces">
            Remove Spaces
        </button>

    </form>

    <h2>Result</h2>

    <div class="result">
        {{ result }}
    </div>

</body>
</html>
